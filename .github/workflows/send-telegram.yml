name: Send scheduled Telegram message

on:
  schedule:
    # Runs every 30 minutes. GitHub Actions cron uses UTC and, under heavy
    # platform load, can delay a run by several minutes past the exact mark
    # (GitHub explicitly does not guarantee scheduled runs fire on the dot).
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 send_telegram.py
